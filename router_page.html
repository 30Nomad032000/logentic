<SCRIPT language="javascript" type="text/javascript">
var loginFlag = 0;
if (window.top != window.self) {
// in a frame
 window.top.location.href = "/admin/login.asp";
}
/* Added by peichao for mission#0007440 */
function CreateCode()
{
 document.getElementById('check_code').value='78pp5';
}
function refresh()
{
 window.location.reload();
}
/* End of mission#0007440 */
function myKeyDown(e)
{
 var code;
 if (!e) {
  e = window.event;
 }
 if (e.keyCode) {
  code = e.keyCode;
 } else if (e.which) {
  code = e.which;
 }
 if (code == 13) {
  on_submit();
 }
 return true;
}
document.onkeydown = myKeyDown;
if (document.captureEvents) document.captureEvents(Event.KEYDOWN);
/********************************************************************
**          on document load
********************************************************************/
function on_init()
{
 document.forms[0].username1.focus();
 var mobileAgent = new Array("iphone", "ipod", "ipad", "android", "mobile", "blackberry", "webos", "incognito", "webmate", "bada", "nokia", "lg", "ucweb", "skyfire");
 var browser = navigator.userAgent.toLowerCase();
 for (var i=0; i<mobileAgent.length; i++){
 if (browser.indexOf(mobileAgent[i])!=-1){ ismobile.value = "1";location.href = '/mobile/login_mobile.asp';break; } }
 var  verificationenable = "1";
 if (verificationenable != "0")
 {
  CreateCode();/* Added by peichao for mission#0007440 */
 }
 if (ismobile.value != "1")
 {
  auto_lang();
  //alert("finish auto lang");
 }
}
/********************************************************************
**          on document submit
********************************************************************/
function on_submit()
{
 if (loginFlag)
  return 1;
 with ( document.forms[0] ) {
  username.value = username1.value;
  psd.value = psd1.value;
  sec_lang.value="0";
  if(username.value.length <= 0) {
   alert("Username is a required field!");
   return;
  }
  if(psd.value.length <= 0) {
   alert("password is a required field!");
   return;
  }
  loginFlag = 1;
  submit();
 }
}
function auto_lang()
{
 with ( document.forms[0] ) {
 var  currentlanguage = "en";
 var  languagesetmode = "1";
 var  is_login_busy = "0";
 var lang = navigator.language || navigator.userLanguage;
 if(languagesetmode == "2" && is_login_busy == "0")
 {
  if(lang.substr(0, 2) == "zh")
  {
   loginSelinit.value = "1" ;
   if(currentlanguage != "cn")
   {
    mlhandle();
    //alert("set to cn");
   }
  }
  else if(lang.substr(0, 2) == "en")
  {
   loginSelinit.value= "0" ;
   if(currentlanguage != "en")
   {
    mlhandle();
    //alert("set to en 1");
   }
  }
  else if(lang.substr(0, 2) == "pt")
  {
   loginSelinit.value= "2" ;
   if(currentlanguage != "pt")
   {
    mlhandle();
    //alert("set to pt");
   }
  }
  else if(lang.substr(0, 2) == "es")
  {
   loginSelinit.value= "3" ;
   if(currentlanguage != "es")
   {
    mlhandle();
    //alert("set to es");
   }
  }
  else
  {
   loginSelinit.value= "0" ;
   if(currentlanguage != "en")
   {
    mlhandle();
    //alert("set to en 2");
   }
  }
 }
 }
}
function mlhandle()
{
 with ( document.forms[0] ) {
  sec_lang.value="1";
  submit();
 }
}
</SCRIPT>
