# Voice Assistant Configuration
# v0.2.0 - Major Upgrade

app:
  name: "Hyper-Localized Voice Assistant"
  version: "0.2.0"
  debug: true

# Development Environment
dev:
  platform: "wsl2"  # Running on WSL2 with CUDA passthrough
  target: "raspberry_pi_5"  # Deployment target

# ASR Configuration
asr:
  engine: "mms"  # Options: mms, pingala, whisper, indic_whisper

  # Meta MMS (1000+ languages, good for Indian languages)
  mms:
    model_id: "facebook/mms-1b-all"
    device: "cpu"

  # Pingala V1 (CPU-first, 2.94% WER)
  pingala:
    model_id: "shunyalabs/pingala-v1-universal"
    device: "cpu"  # CPU-optimized, no GPU needed

  # Whisper (legacy fallback)
  whisper:
    model_size: "small"  # Options: tiny, base, small, medium, large
    device: "cuda"  # Options: cuda, cpu
    language: null  # null for auto-detection

# TTS Configuration
tts:
  engine: "mms"  # Options: mms (offline), cartesia (online), indic, chatterbox
  default_language: "ml"  # Malayalam default

  # MMS-TTS (Offline - Recommended for speed)
  mms:
    device: "cpu"

  # Indic Parler-TTS (69 voices, emotion control)
  indic:
    variant: "mini"  # Options: full, mini (recommended for edge)
    device: "cpu"

  # Chatterbox-Turbo (350M, low compute, 24kHz)
  chatterbox:
    device: "cpu"

  # Cartesia (Online - High quality)
  cartesia:
    api_key: "${CARTESIA_API_KEY}"  # Set in .env
    model_id: "sonic-2"
    voice_id: null

  supported_languages:
    - ml  # Malayalam (primary)
    - hi  # Hindi
    - ta  # Tamil
    - te  # Telugu
    - bn  # Bengali
    - mr  # Marathi
    - gu  # Gujarati
    - kn  # Kannada
    - en  # English

# Translation Configuration
translation:
  engine: "indictrans2"
  device: "cpu"
  model_variant: "dist"  # Options: full (1B), dist (~211M, 5x smaller, recommended)
  source_lang: "ml"  # Malayalam (user speaks)
  target_lang: "en"  # English (LLM processes)
  enable_m2m: false  # Enable direct Indic-to-Indic translation

# LLM Configuration
llm:
  engine: "qwen3"  # Options: qwen (2.5), qwen3 (recommended)
  model_size: "0.6b"  # Qwen3 options: 0.6b, 1.7b, 4b | Qwen2.5 options: 0.5b, 1.5b, 3b, 7b
  device: "cpu"
  backend: "llamacpp"  # Options: llamacpp (recommended for edge), transformers
  max_new_tokens: 256
  temperature: 0.7
  max_memory_messages: 10

  # llama.cpp backend config (used when backend=llamacpp)
  llamacpp:
    n_ctx: 2048
    n_threads: 4
    n_gpu_layers: 0  # 0 for CPU-only on Pi
    quantization: "Q8_0"  # Options: Q4_K_M, Q5_K_M, Q8_0 (using Q8_0 for Qwen3-0.6B)

# Inference Engine Configuration
inference:
  asr_backend: "transformers"  # Options: transformers, onnx
  tts_backend: "transformers"  # Options: transformers, onnx
  llm_backend: "llamacpp"  # Options: llamacpp, transformers

# NLU Configuration (optional - LLM handles this now)
nlu:
  intent_model: "local"  # Options: local, openai, anthropic
  confidence_threshold: 0.7

# Pipeline Configuration
pipeline:
  mode: "pipecat"  # Options: pipecat (recommended), legacy
  default_language: "ml"

# Agent Configuration
agents:
  orchestrator: "langgraph"  # Options: langgraph, clawgo

  # ClawGo (OpenClaw Pi node) config
  clawgo:
    gateway_url: "http://localhost:11434"  # Ollama endpoint
    llm_provider: "ollama"
    llm_model: "qwen3:1.7b"
    workspace_dir: null  # Uses config/clawgo/ by default

  available_agents:
    - name: "info_agent"
      description: "Handles information queries and general QA"
      enabled: true
    - name: "task_agent"
      description: "Manages tasks, reminders, and calendar"
      enabled: true
    - name: "chat_agent"
      description: "General conversation"
      enabled: true
    - name: "smart_home_agent"
      description: "Controls smart home devices"
      enabled: false

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

# Edge Device Configuration
edge:
  device_type: "raspberry_pi_5"
  audio:
    sample_rate: 16000
    channels: 1
    chunk_size: 1024
  wake_word:
    enabled: true
    keyword: "hey assistant"
    sensitivity: 0.5

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
